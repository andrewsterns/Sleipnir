name: Release

# Cut a release by pushing a version tag, e.g. `npm version patch && git push --tags`.
# See RELEASING.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required so electron-builder can create/upload the GitHub Release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installers
        run: npm run electron:publish
        env:
          # electron-builder reads GH_TOKEN to upload to GitHub Releases; the
          # built-in GITHUB_TOKEN works thanks to `permissions: contents: write`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are unsigned for now — disable macOS signing-identity
          # discovery so the mac build doesn't fail looking for a certificate.
          # Remove this once an Apple Developer ID is configured (see RELEASING.md).
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # electron-builder uploads both platforms into one DRAFT release, which
  # neither users nor the in-app updater can see. Publish it only once every
  # platform built — a failed macOS build never ships a Windows-only release.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
